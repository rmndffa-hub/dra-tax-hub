name: Perbarui umpan berita

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: umpan-berita
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ambil berita
        id: ambil
        continue-on-error: true
        working-directory: dra-tax-hub
        run: node scripts/fetch-news.mjs

      - name: Commit kalau ada perubahan
        run: |
          FEED=dra-tax-hub/assets/data/feed.json
          if [ -z "$(git status --porcelain $FEED)" ]; then
            echo "Tidak ada perubahan pada feed.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FEED
          git commit -m "Perbarui umpan berita ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push

      - name: Tandai gagal bila pengambilan bermasalah
        if: steps.ambil.outcome == 'failure'
        run: |
          echo "::warning::Pengambilan berita gagal. Lihat log langkah 'Ambil berita'."
          exit 1
